# ==========================================================
# ATIVAÇÃO DO PERFIL (Obrigatório para rodar o Seed)
# Padrão: dev. Para outro ambiente, defina a variável de
# ambiente SPRING_PROFILES_ACTIVE (ex.: prod) sem alterar o código.
# ==========================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ==========================================================
# IDENTIFICAÇÃO DA APLICAÇÃO
# Define o nome da aplicação Spring Boot.
# Pode ser utilizado em logs, monitoramento e Spring Cloud.
# ==========================================================
spring.application.name=rest-with-springboot-java


# ==========================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# Define como a aplicação se conecta ao banco PostgreSQL.
# Credenciais NUNCA ficam no repositório: são lidas de variáveis
# de ambiente (DB_USER, DB_PASSWORD, DB_URL).
# Valores após ":" são apenas padrões não sensíveis.
# ==========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rest_with_springboot_java}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Importa o arquivo local (NÃO versionado) onde DB_PASSWORD é definida.
# "optional:" evita erro caso o arquivo não exista (ex.: em produção,
# onde a variável vem do ambiente do servidor).
spring.config.import=optional:classpath:application-local.properties


# ==========================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE & FLYWAY
# Controla como o Hibernate interage com o esquema do banco.
# ==========================================================
# Opções de ddl-auto disponíveis:
# - update : Atualiza o banco automaticamente com base nas entidades Java (Perigoso ao usar Flyway).
# - validate: Apenas compara as entidades com o banco, sem alterar nada.
# - none   : Desativa qualquer alteração automática pelo Hibernate. Ideal para uso com Flyway/Liquibase.(ao ter o Flyway,
# é recomendado usar "none" para evitar conflitos no trabalho com migrações ou versionamento de banco de dados)


#Quando você configura spring.jpa.hibernate.ddl-auto=none, você está dizendo explicitamente ao Hibernate:
#"Meu amigo Hibernate, tire as mãos do meu banco de dados! Você não vai mais criar tabelas, \
#  alterar colunas e nem dar DROP em nada. Quem manda na estrutura física do banco agora é o Flyway."
spring.jpa.hibernate.ddl-auto=none

#spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desativa o aviso padrão do open-in-view do JPA
spring.jpa.open-in-view=false

# Permite que o Flyway assuma um banco que já possui tabelas e ainda
# não tem histórico de migrações (cria o "baseline" na primeira execução).
# Em banco novo/vazio não causa efeito.
spring.flyway.baseline-on-migrate=true


# ==========================================================
# CONFIGURAÇÃO DE LOGS PARA O PROJETO REST WITH SPRING BOOT
# O nível detalhado (DEBUG) do pacote do projeto fica em
# application-dev.properties, ativo apenas no perfil dev.
# ==========================================================
# 1. Nível padrão para todo o resto da aplicação (projeto inteiro em WARN)
#logging.level.root=INFO
logging.level.root=WARN
#logging.level.com.dinisjovete.restwithspringbootjava=INFO

# Exibe os logs detalhados de migração do Flyway no console
logging.level.org.flywaydb=INFO


# ==========================================================
# CONFIGURAÇÃO DO SWAGGER / OPENAPI
# Os grupos (People V1, People V2 e Book) são definidos na classe
# OpenApiConfig (config.swagger), por caminho: /person/v1/**,
# /person/v2/** e /book/**.
# ==========================================================
# Grupo que o Swagger UI abre por padrão (usa o displayName do grupo:
# "People V1", "People V2" ou "Book")
springdoc.swagger-ui.urls-primary-name=Book


# ==========================================================
# CONFIGURAÇÃO DA INTERFACE SWAGGER UI
# ==========================================================

# Ativa ou desativa a interface gráfica do Swagger UI no navegador.
# true  -> Swagger UI fica disponível
# false -> Swagger UI é desativado
springdoc.swagger-ui.enabled=true

# Faz o Swagger UI ser servido a partir do caminho raiz da aplicação.
# Útil quando a aplicação está configurada atrás de um contexto raiz,
# proxy reverso ou gateway.
springdoc.swagger-ui.use-root-path=true

# Define o endereço onde a interface Swagger UI será acessada.
# Exemplo:
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html