# ==========================================================
# ATIVAÇÃO DO PERFIL (Obrigatório para rodar o Seed)
# ==========================================================
spring.profiles.active=dev


# ==========================================================
# IDENTIFICAÇÃO DA APLICAÇÃO
# Define o nome da aplicação Spring Boot.
# Pode ser utilizado em logs, monitoramento e Spring Cloud.
# ==========================================================
spring.application.name=rest-with-springboot-java


# ==========================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# Define como a aplicação se conecta ao banco PostgreSQL.
# ==========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/rest_with_springboot_java
spring.datasource.username=postgres
spring.datasource.password=1985


# ==========================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE & FLYWAY
# Controla como o Hibernate interage com o esquema do banco.
# ==========================================================
# Opções de ddl-auto disponíveis:
# - update : Atualiza o banco automaticamente com base nas entidades Java (Perigoso ao usar Flyway).
# - validate: Apenas compara as entidades com o banco, sem alterar nada.
# - none   : Desativa qualquer alteração automática pelo Hibernate. Ideal para uso com Flyway/Liquibase.(ao ter o Flyway,
# é recomendado usar "none" para evitar conflitos no trabalho com migrações ou versionamento de banco de dados)


#Quando você configura spring.jpa.hibernate.ddl-auto=none, você está dizendo explicitamente ao Hibernate:
#"Meu amigo Hibernate, tire as mãos do meu banco de dados! Você não vai mais criar tabelas, \
#  alterar colunas e nem dar DROP em nada. Quem manda na estrutura física do banco agora é o Flyway."
spring.jpa.hibernate.ddl-auto=none

#spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================================
# CONFIGURAÇÃO DE LOGS PARA O PROJETO REST WITH SPRING BOOT
