# ==========================================================
# ATIVAÇÃO DO PERFIL (Obrigatório para rodar o Seed)
# ==========================================================
spring.profiles.active=dev


# ==========================================================
# IDENTIFICAÇÃO DA APLICAÇÃO
# Define o nome da aplicação Spring Boot.
# Pode ser utilizado em logs, monitoramento e Spring Cloud.
# ==========================================================
spring.application.name=rest-with-springboot-java


# ==========================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# Define como a aplicação se conecta ao banco PostgreSQL.
# ==========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/rest_with_springboot_java
spring.datasource.username=postgres
spring.datasource.password=1985


# ==========================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# Controla como as entidades Java são mapeadas para o banco
# e exibe os comandos SQL gerados durante a execução.
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# CONFIGURAÇÃO DE LOGS PARA O PROJETO REST WITH SPRING BOOT
# ==========================================================
# 1. Nível padrão para todo o resto da aplicação (projeto inteiro em INFO)
#logging.level.root=INFO
logging.level.root=WARN
#logging.level.com.dinisjovete.restwithspringbootjava=INFO

# 2. Ativa o DEBUG somente em um sub pacote específico (exemplo: services)
#logging.level.com.dinisjovete.restwithspringbootjava=INFO
logging.level.com.dinisjovete.restwithspringbootjava=DEBUG
#logging.level.com.dinisjovete.restwithspringbootjava.config.PersonTestDataConfig=WARN
#logging.level.com.dinisjovete.restwithspringbootjava.services=DEBUG


