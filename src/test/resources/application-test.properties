# ==========================================================
# CONFIGURAÇÃO DO SERVIDOR WEB DE TESTES
# Usa uma porta aleatória para evitar conflitos com aplicações
# já executando na porta padrão (8080).
# ==========================================================

server.port=0


# ==========================================================
# PERFIL DE TESTE
# Configuração utilizada somente durante os testes automatizados.
# O banco PostgreSQL é criado pelo Testcontainers através do Docker.
# ==========================================================

spring.application.name=rest-with-springboot-java-test

# ==========================================================
# JPA / HIBERNATE
# O Hibernate não cria nem altera tabelas.
# A estrutura do banco continua sendo controlada pelo Flyway.
# ==========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


# ==========================================================
# FLYWAY
# Executa as migrations no banco temporário criado pelo Testcontainers.
# ==========================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# ==========================================================
# LOGS DE TESTE
# Mantém os testes mais limpos.
# ==========================================================

logging.level.root=WARN
logging.level.org.flywaydb=INFO